<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RentEase — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#222636;--border:#2d3148;--accent:#c8541a;--accent2:#e8a020;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--text:#e8eaf0;--muted:#8b90a8;--white:#fff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow:hidden;}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sb-logo{padding:1.5rem 1.25rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--border);}
.sb-logo-text{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--white);}
.sb-logo-text span{color:var(--accent);}
.sb-badge{font-size:.58rem;background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;font-weight:700;}
.sb-nav{flex:1;padding:.75rem 0;overflow-y:auto;}
.sb-section{font-size:.62rem;font-weight:700;letter-spacing:2px;color:var(--muted);padding:.5rem 1.25rem;text-transform:uppercase;margin-top:.5rem;}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.25rem;cursor:pointer;transition:all .2s;border-left:3px solid transparent;color:var(--muted);font-size:.85rem;font-weight:500;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(200,84,26,.12);color:var(--accent);border-left-color:var(--accent);}
.nav-icon{font-size:1rem;flex-shrink:0;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.58rem;padding:1px 6px;border-radius:10px;font-weight:700;}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid var(--border);}
.admin-info{display:flex;align-items:center;gap:.75rem;}
.admin-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0;}
.admin-name{font-size:.78rem;font-weight:600;color:var(--text);}
.admin-role{font-size:.65rem;color:var(--muted);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:.75rem;flex-shrink:0;}
.topbar-title{font-size:.95rem;font-weight:700;flex:1;}
.topbar-search{display:flex;align-items:center;gap:.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.35rem .75rem;width:200px;}
.topbar-search input{background:none;border:none;outline:none;font-size:.8rem;color:var(--text);width:100%;font-family:'Inter',sans-serif;}
.topbar-search input::placeholder{color:var(--muted);}
.topbar-btn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:background .2s;}
.topbar-btn:hover{background:var(--border);}
.content{flex:1;overflow-y:auto;padding:1.25rem;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.25rem;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem;transition:transform .2s;}
.kpi-card:hover{transform:translateY(-2px);}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;}
.kpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.kpi-trend{font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:6px;}
.kpi-trend.up{background:rgba(34,197,94,.15);color:var(--green);}
.kpi-trend.down{background:rgba(239,68,68,.15);color:var(--red);}
.kpi-val{font-size:1.6rem;font-weight:700;color:var(--white);margin-bottom:.15rem;}
.kpi-label{font-size:.7rem;color:var(--muted);}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:1.25rem;overflow:hidden;}
.sc-header{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.1rem;border-bottom:1px solid var(--border);}
.sc-title{font-size:.85rem;font-weight:700;}
.sc-actions{display:flex;gap:.4rem;}
.btn-sm{padding:.3rem .8rem;border-radius:7px;font-size:.72rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all .2s;font-family:'Inter',sans-serif;}
.btn-sm:hover{background:var(--border);}
.btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-sm.primary:hover{background:#a83e10;}
.btn-sm.danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--red);}
.btn-sm.success{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:var(--green);}
table{width:100%;border-collapse:collapse;}
th{padding:.6rem .9rem;text-align:left;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);border-bottom:1px solid var(--border);}
td{padding:.6rem .9rem;font-size:.8rem;border-bottom:1px solid rgba(45,49,72,.5);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:2px 8px;border-radius:100px;font-size:.68rem;font-weight:600;}
.badge.green{background:rgba(34,197,94,.15);color:var(--green);}
.badge.red{background:rgba(239,68,68,.15);color:var(--red);}
.badge.yellow{background:rgba(232,160,32,.15);color:var(--accent2);}
.badge.blue{background:rgba(59,130,246,.15);color:var(--blue);}
.badge.purple{background:rgba(168,85,247,.15);color:var(--purple);}
.badge.gray{background:rgba(139,144,168,.15);color:var(--muted);}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;background:currentColor;}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;}
.mini-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:.4rem;}
.mini-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s ease;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.65rem;}
.form-group{display:flex;flex-direction:column;gap:.35rem;}
.form-group label{font-size:.75rem;font-weight:600;color:var(--muted);}
.form-group input,.form-group select,.form-group textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;font-size:.82rem;color:var(--text);outline:none;font-family:'Inter',sans-serif;transition:border-color .2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
.form-group textarea{resize:vertical;min-height:70px;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px);}
.modal-ov.open{display:flex;animation:fi .2s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.75rem;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.modal-head h3{font-size:.95rem;font-weight:700;}
.modal-close-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:background .2s;color:var(--text);}
.modal-close-btn:hover{background:var(--border);}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:.8rem;display:flex;align-items:center;gap:.5rem;transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}
.tab-row{display:flex;gap:.25rem;margin-bottom:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.25rem;}
.tab{padding:.45rem 1rem;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted);}
.tab.active{background:var(--accent);color:#fff;}
.tab:hover:not(.active){background:var(--surface2);color:var(--text);}
.stat-rows{display:flex;flex-direction:column;gap:.75rem;padding:1rem 1.1rem;}
.stat-row-item{display:flex;align-items:center;gap:.65rem;}
.stat-row-icon{font-size:1.3rem;width:28px;text-align:center;}
.stat-row-info{flex:1;}
.stat-row-label{font-size:.72rem;color:var(--muted);}
.stat-row-val{font-size:.88rem;font-weight:700;color:var(--white);}
.donut-wrap{display:flex;align-items:center;gap:1.5rem;padding:1.1rem;}
.donut{position:relative;width:100px;height:100px;}
.donut svg{transform:rotate(-90deg);}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:var(--white);}
.donut-center span{font-size:.62rem;color:var(--muted);font-weight:400;}
.donut-legend{display:flex;flex-direction:column;gap:.45rem;}
.legend-item{display:flex;align-items:center;gap:.45rem;font-size:.75rem;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;background:var(--bg);position:fixed;inset:0;z-index:500;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.25rem;width:340px;}
.login-logo{text-align:center;margin-bottom:1.75rem;}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--white);}
.login-logo h1 span{color:var(--accent);}
.login-logo p{font-size:.78rem;color:var(--muted);margin-top:.3rem;}
.login-hint{text-align:center;margin-top:.85rem;font-size:.72rem;color:var(--muted);}
.login-hint a{color:var(--accent);cursor:pointer;}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{display:none}.chart-row{grid-template-columns:1fr}}
</style>
</head>

function buildDonut(){
  const ps=DB.getProducts();const cats={Furniture:0,Appliances:0,Electronics:0,Bedroom:0};
  ps.forEach(p=>{if(cats[p.category]!==undefined)cats[p.category]++;});
  const total=ps.length;const colors=['#c8541a','#e8a020','#3b82f6','#22c55e'];const vals=Object.values(cats);
  let offset=0;const r=38;const circ=2*Math.PI*r;
  const slices=vals.map((v,i)=>{const pct=v/total;const dash=pct*circ;const sl=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="14" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" opacity=".9"/>`;offset+=dash;return sl;}).join('');
  return`<div class="donut"><svg width="100" height="100" viewBox="0 0 100 100">${slices}</svg><div class="donut-center">${total}<span>total</span></div></div>`;
}

  return`<div class="tab-row"><div class="tab active" onclick="filterRentals('all',this)">All (${rentals.length})</div><div class="tab" onclick="filterRentals('active',this)">Active (${rentals.filter(r=>r.status==='active').length})</div><div class="tab" onclick="filterRentals('returned',this)">Returned (${rentals.filter(r=>r.status==='returned').length})</div></div>
  <div class="section-card"><div class="sc-header"><span class="sc-title">All Rentals</span></div>
  <table><thead><tr><th>ID</th><th>Customer</th><th>Product</th><th>Tenure</th><th>Monthly</th><th>End Date</th><th>City</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody id="rentBody">${rentals.map(r=>rentalRow(r)).join('')}</tbody></table></div>`;
}
function rentalRow(r){return`<tr><td style="color:var(--muted);font-size:.68rem">${r.id}</td><td><b>${r.userName}</b></td><td>${r.productName}</td><td>${r.tenure}mo</td><td style="font-weight:700">₹${r.rentPerMonth.toLocaleString()}</td><td>${r.endDate}</td><td>${r.city}</td><td>${sBadge(r.status)}</td><td style="display:flex;gap:.3rem">${r.status==='active'?`<button class="btn-sm success" onclick="markReturned('${r.id}')">Returned</button>`:''}<button class="btn-sm" onclick="viewRental('${r.id}')">View</button></td></tr>`;}
function filterRentals(s,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');const all=DB.getRentals();document.getElementById('rentBody').innerHTML=(s==='all'?all:all.filter(r=>r.status===s)).map(r=>rentalRow(r)).join('');}
function markReturned(id){DB.updateRental(id,{status:'returned'});toast('✅','Marked returned');renderPage('rentals');}
function viewRental(id){
  const r=DB.getRentalById(id);
  document.getElementById('modalTitle').textContent='Rental: '+r.id;
  document.getElementById('modalBody').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.85rem"><div><div style="font-size:.68rem;color:var(--muted)">Customer</div><div style="font-weight:700">${r.userName}</div></div><div><div style="font-size:.68rem;color:var(--muted)">Product</div><div>${r.productName}</div></div><div><div style="font-size:.68rem;color:var(--muted)">Tenure</div><div>${r.tenure} months</div></div><div><div style="font-size:.68rem;color:var(--muted)">Monthly Rent</div><div style="font-weight:700;color:var(--accent)">₹${r.rentPerMonth.toLocaleString()}</div></div><div><div style="font-size:.68rem;color:var(--muted)">Deposit</div><div>₹${r.deposit.toLocaleString()}</div></div><div><div style="font-size:.68rem;color:var(--muted)">Total Value</div><div>₹${(r.rentPerMonth*r.tenure).toLocaleString()}</div></div><div><div style="font-size:.68rem;color:var(--muted)">Start</div><div>${r.startDate}</div></div><div><div style="font-size:.68rem;color:var(--muted)">End</div><div>${r.endDate}</div></div><div style="grid-column:1/-1"><div style="font-size:.68rem;color:var(--muted)">Address</div><div>${r.address}</div></div></div>Status: ${sBadge(r.status)}<br><button class="btn-sm" style="margin-top:.85rem;width:100%" onclick="closeModal()">Close</button>`;
  openModal();
}

// ===================== MAINTENANCE =====================
function buildMaintenance(requests){
  return`<div class="section-card"><div class="sc-header"><span class="sc-title">Maintenance Requests (${requests.length})</span></div>
  <table><thead><tr><th>Customer</th><th>Product</th><th>Issue</th><th>Priority</th><th>Raised</th><th>Status</th><th>Actions</th></tr></thead><tbody>
  ${requests.map(m=>`<tr><td><b>${m.userName}</b></td><td>${m.productName}</td><td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)">${m.issue}</td><td><span style="font-weight:700;color:${m.priority==='high'?'var(--red)':m.priority==='medium'?'var(--accent2)':'var(--green)'}">${m.priority.toUpperCase()}</span></td><td style="color:var(--muted)">${m.raisedOn}</td><td>${sBadge(m.status)}</td><td style="display:flex;gap:.3rem">${m.status==='open'?`<button class="btn-sm" onclick="updMaint('${m.id}','in-progress')">Start</button>`:''}${m.status==='in-progress'?`<button class="btn-sm success" onclick="updMaint('${m.id}','resolved')">Resolve</button>`:''}<button class="btn-sm" onclick="viewMaint('${m.id}')">View</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function updMaint(id,s){const up={status:s};if(s==='resolved')up.resolvedOn=new Date().toISOString().split('T')[0];DB.updateMaintenance(id,up);updateMaintBadge();toast('✅','Updated');renderPage('maintenance');}
function viewMaint(id){
  const m=DB.getMaintenance().find(x=>x.id===id);
  document.getElementById('modalTitle').textContent='Maintenance Request';
  document.getElementById('modalBody').innerHTML=`<div style="display:flex;flex-direction:column;gap:.5rem;margin-bottom:.85rem"><div><b>Customer:</b> ${m.userName}</div><div><b>Product:</b> ${m.productName}</div><div><b>Issue:</b> ${m.issue}</div><div><b>Priority:</b> <span style="font-weight:700;color:${m.priority==='high'?'var(--red)':m.priority==='medium'?'var(--accent2)':'var(--green)'}">${m.priority.toUpperCase()}</span></div><div><b>Status:</b> ${sBadge(m.status)}</div><div><b>Raised:</b> ${m.raisedOn}</div>${m.resolvedOn?`<div><b>Resolved:</b> ${m.resolvedOn}</div>`:''}</div><button class="btn-sm" style="width:100%" onclick="closeModal()">Close</button>`;
  openModal();
}

// ===================== DELIVERIES =====================
function buildDeliveries(deliveries){
  return`<div class="section-card"><div class="sc-header"><span class="sc-title">Delivery & Pickup Schedule (${deliveries.length})</span></div>
  <table><thead><tr><th>ID</th><th>Rental</th><th>Type</th><th>Date</th><th>Agent</th><th>Status</th><th>Actions</th></tr></thead><tbody>
  ${deliveries.map(d=>`<tr><td style="color:var(--muted);font-size:.68rem">${d.id}</td><td>${d.rentalId}</td><td><span class="badge ${d.type==='delivery'?'blue':'purple'}">${d.type}</span></td><td>${d.scheduledDate}</td><td>${d.agent}</td><td>${sBadge(d.status)}</td><td>${d.status==='scheduled'?`<button class="btn-sm success" onclick="completeDelivery('${d.id}')">Done</button>`:'<span style="color:var(--muted)">—</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function completeDelivery(id){DB.updateDelivery(id,{status:'completed'});toast('✅','Marked complete');renderPage('deliveries');}

// ===================== ANALYTICS =====================
function buildAnalytics(){
  const s=DB.getStats();
  const prods=DB.getProducts().sort((a,b)=>b.totalRented-a.totalRented).slice(0,6);
  const max=Math.max(...prods.map(p=>p.totalRented));
  function catRev(cat){return DB.getRentals().filter(r=>r.status==='active').reduce((sum,r)=>{const p=DB.getProducts().find(pr=>pr.id===r.productId);return p&&p.category===cat?sum+r.rentPerMonth:sum;},0);}
  return`<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:rgba(34,197,94,.15)">💰</div></div><div class="kpi-val">₹${s.mrr.toLocaleString()}</div><div class="kpi-label">Monthly Recurring Revenue</div></div>
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:rgba(200,84,26,.15)">📊</div></div><div class="kpi-val">${((s.activeRentals/s.totalProducts)*100).toFixed(0)}%</div><div class="kpi-label">Product Utilization Rate</div></div>
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:rgba(59,130,246,.15)">👤</div></div><div class="kpi-val">${((s.activeUsers/s.totalUsers)*100).toFixed(0)}%</div><div class="kpi-label">User Retention Rate</div></div>
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:rgba(168,85,247,.15)">🔧</div></div><div class="kpi-val">${s.resolvedMaintenance}</div><div class="kpi-label">Maintenance Resolved</div></div>
  </div>
  <div class="chart-row">
    <div class="section-card"><div class="sc-header"><span class="sc-title">Top Products by Rentals</span></div><div style="padding:1.1rem;display:flex;flex-direction:column;gap:.85rem">
    ${prods.map(p=>`<div><div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.3rem"><span>${p.icon} ${p.name}</span><span style="font-weight:700;color:var(--accent)">${p.totalRented}</span></div><div class="mini-bar"><div class="mini-bar-fill" style="width:${(p.totalRented/max*100).toFixed(0)}%"></div></div></div>`).join('')}
    </div></div>
    <div class="section-card"><div class="sc-header"><span class="sc-title">Revenue by Category</span></div><div class="stat-rows">
      <div class="stat-row-item"><div class="stat-row-icon">🛋️</div><div class="stat-row-info"><div class="stat-row-label">Furniture</div><div class="stat-row-val">₹${catRev('Furniture').toLocaleString()}/mo</div></div></div>
      <div class="stat-row-item"><div class="stat-row-icon">❄️</div><div class="stat-row-info"><div class="stat-row-label">Appliances</div><div class="stat-row-val">₹${catRev('Appliances').toLocaleString()}/mo</div></div></div>
      <div class="stat-row-item"><div class="stat-row-icon">📺</div><div class="stat-row-info"><div class="stat-row-label">Electronics</div><div class="stat-row-val">₹${catRev('Electronics').toLocaleString()}/mo</div></div></div>
      <div class="stat-row-item"><div class="stat-row-icon">📈</div><div class="stat-row-info"><div class="stat-row-label">Annual Run Rate</div><div class="stat-row-val">₹${(s.mrr*12).toLocaleString()}</div></div></div>
    </div></div>
  </div>
  <div class="section-card"><div class="sc-header"><span class="sc-title">KPI Summary</span><div class="sc-actions"><button class="btn-sm primary" onclick="exportReport()">Export</button></div></div>
  <table><thead><tr><th>KPI</th><th>Value</th><th>Target</th><th>Status</th></tr></thead><tbody>
    <tr><td>Active Rentals</td><td><b>${s.activeRentals}</b></td><td>10</td><td>${s.activeRentals>=10?'<span class="badge green">On Track</span>':'<span class="badge yellow">Below</span>'}</td></tr>
    <tr><td>MRR</td><td><b>₹${s.mrr.toLocaleString()}</b></td><td>₹10,000</td><td>${s.mrr>=10000?'<span class="badge green">On Track</span>':'<span class="badge yellow">Below</span>'}</td></tr>
    <tr><td>Utilization Rate</td><td><b>${((s.activeRentals/s.totalProducts)*100).toFixed(0)}%</b></td><td>60%</td><td>${(s.activeRentals/s.totalProducts)>=0.6?'<span class="badge green">On Track</span>':'<span class="badge yellow">Below</span>'}</td></tr>
    <tr><td>Open Maintenance</td><td><b>${s.openMaintenance}</b></td><td>&lt;3</td><td>${s.openMaintenance<=3?'<span class="badge green">Good</span>':'<span class="badge red">Attention</span>'}</td></tr>
    <tr><td>User Retention</td><td><b>${((s.activeUsers/s.totalUsers)*100).toFixed(0)}%</b></td><td>80%</td><td>${(s.activeUsers/s.totalUsers)>=0.8?'<span class="badge green">On Track</span>':'<span class="badge yellow">Below</span>'}</td></tr>
  </tbody></table></div>`;
}
function exportReport(){
  const s=DB.getStats();
  const txt=`RentEase Admin Report\n======================\nDate: ${new Date().toLocaleDateString()}\n\nKEY METRICS\nTotal Users: ${s.totalUsers}\nActive Rentals: ${s.activeRentals}\nMRR: Rs.${s.mrr.toLocaleString()}\nAvailable Products: ${s.availableProducts}/${s.totalProducts}\nOpen Maintenance: ${s.openMaintenance}\n\nGenerated by RentEase Admin Dashboard`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='rentease_report.txt';a.click();toast('✅','Report exported!');
}

// ===================== SEARCH =====================
function handleSearch(v){
  if(!v.trim()){renderPage(currentPage);return;}
  const q=v.toLowerCase();
  if(currentPage==='users')document.getElementById('pageContent').innerHTML=buildUsers(DB.getUsers().filter(u=>u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||u.city.toLowerCase().includes(q)));
  else if(currentPage==='products')document.getElementById('pageContent').innerHTML=buildProducts(DB.getProducts().filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
  else if(currentPage==='rentals')document.getElementById('pageContent').innerHTML=buildRentals(DB.getRentals().filter(r=>r.userName.toLowerCase().includes(q)||r.productName.toLowerCase().includes(q)));
}

// ===================== MODAL / TOAST =====================
function openModal(){document.getElementById('modalOv').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modalOv').classList.remove('open');document.body.style.overflow='';}
function closeModalOuter(e){if(e.target===document.getElementById('modalOv'))closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
let tT;
function toast(icon,msg){document.getElementById('tIcon').textContent=icon;document.getElementById('tMsg').textContent=msg;const t=document.getElementById('toast');t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3200);}
</script>
</body>
</html>
